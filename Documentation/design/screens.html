<!doctype html>
<meta charset="utf-8">
<title>Dubplate — design renderings</title>
<!--
  These are NOT screenshots of the running application. There is no Apple toolchain
  in the environment this repository was built in, so nothing has been launched.

  Each screen below is redrawn in HTML from the values in
  Packages/DubplateUI/DesignSystem — the same palette, the same spacing scale, the
  same type sizes, the same corner radii, the same placeholder-cover hash — so the
  hierarchy, density and proportions can be judged. Behaviour, real type rendering
  and system controls are not represented.

  Regenerate the images with: python3 Tools/render_design.py
-->
<style>

  :root {
    --ground: #0B0B0C;
    --raised: #141416;
    --sunken: #1C1C1F;
    --hairline: rgba(244,243,241,0.10);
    --primary: #F4F3F1;
    --secondary: rgba(244,243,241,0.60);
    --tertiary: rgba(244,243,241,0.50);
    --alert: #E0684E;
    --player-ground: #0B0B0C;

    /* ---- DubplateLayout ---- */
    --xs: 4px; --s: 8px; --m: 12px; --l: 16px; --xl: 24px; --xxl: 32px; --xxxl: 48px;

    background: #2a2a2e; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;

  }
  .caption { color: #999; font-size: 12px; margin-bottom: 8px; letter-spacing: 0.06em; text-transform: uppercase; }
  .screen { background: var(--ground); color: var(--primary); overflow: hidden; position: relative; }
  .mac { width: 1180px; height: 760px; border-radius: 10px; display: flex; }
  .phone { width: 393px; height: 852px; border-radius: 44px; border: 1px solid rgba(255,255,255,0.12); }

  .display-30 { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.08; }
  .display-26 { font-size: 26px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.1; }

  .np-title { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
  .np-artist { font-size: 17px; color: var(--player-secondary); }

  /* ---- artwork ---- */
  .art { border-radius: var(--artwork-radius); position: relative; overflow: hidden;

  .art .name { position: absolute; left: 9%; top: 9%; right: 9%; color: #fff;

  .sidebar .item.on { background: var(--sunken); color: var(--primary); }

  .card .a { font-size: 13px; color: var(--secondary); }

  .track .num { width: 26px; text-align: center; font-size: 12px; color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .track .name { flex: 1; font-size: 14px; }
  .track .dur { font-size: 12px; color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .pill { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--secondary);
          background: var(--sunken); border-radius: 99px; padding: 2px 6px; }
  .bars { display: flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 10px; }
  .bars i { width: 2px; background: var(--primary); border-radius: 1px; display: block; }

  /* ---- buttons ---- */
  .filled { height: 32px; padding: 0 16px; border-radius: 99px; background: var(--primary); color: var(--ground);
            font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .quiet { height: 32px; padding: 0 16px; border-radius: 99px; background: var(--sunken); color: var(--primary);
           font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }

  /* ---- inspector ---- */
  .inspector { width: 320px; background: var(--raised); border-left: 1px solid var(--hairline);
               padding: var(--xl); display: flex; flex-direction: column; gap: var(--xl); flex: none; overflow: hidden; }
  .field { display: flex; flex-direction: column; gap: var(--xs); }
  .field .box { font-size: 15px; padding: 0 0 5px; border-bottom: 1px solid var(--hairline); }
  .field .box.focused { border-bottom-color: var(--primary); }

  .wave i { width: 2px; border-radius: 1px; display: block; }
  .times { display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }

                background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); }
  .modepicker span { font-size: 11px; font-weight: 500; letter-spacing: 0.3px; padding: 0 12px; height: 26px;
                     display: flex; align-items: center; border-radius: 99px; color: var(--player-secondary); }
  .modepicker span.on { background: rgba(255,255,255,0.16); color: var(--player-primary); }
</style>

<script>
// MonogramArtwork: the same djb2 hash over the title that the app uses, so a
// placeholder cover here is the placeholder cover the app would draw.
function shades(title) {
  let hash = 5381n;
  for (const byte of new TextEncoder().encode(title || 'Untitled')) {
    hash = BigInt.asUintN(64, hash * 33n + BigInt(byte));
  }
  const hue = Number(hash % 360n);
  return [`hsl(${hue} 12% 30%)`, `hsl(${hue} 14% 13%)`];
}
function art(title, size, radius, artist) {
  const [a, b] = shades(title);
  const edge = typeof size === 'number' ? size + 'px' : size;
  const px = typeof size === 'number' ? size : 220;
  const type = px >= 64 ? `
    <div class="name" style="font-size:${px*0.15}px;letter-spacing:${px*-0.0033}px">${title}</div>
    ${artist ? `<div class="credit" style="font-size:${px*0.045}px;top:auto;bottom:9%">${artist}</div>` : ''}` : '';
  return `<div class="art" style="width:${edge};height:${edge};border-radius:${radius === 0 ? 0 : (radius || 4)}px;
    background:linear-gradient(135deg, ${a}, ${b})">${type}</div>`;
}
function waveform(count, progress, colorOn, colorOff) {
  let out = '';
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const h = 3 + Math.abs(Math.sin(t * 11) * Math.cos(t * 3.3) + Math.sin(t * 27) * 0.35) * 21;
    out += `<i style="height:${h.toFixed(1)}px;background:${t < progress ? colorOn : colorOff}"></i>`;
  }
  return `<div class="wave">${out}</div>`;
}
const NO_SIGNAL = ['Intro','Dust','Something New','Untitled','After Dark','Midnight','Low Ceiling','Hold','Static','No Signal'];
const DURS = ['1:34','3:58','4:21','2:49','5:07','3:42','4:03','2:18','1:51','6:12'];
const LIB = ['NO SIGNAL','BLUE ROOM','Midnight','TEST PRESSING','ROOM TONE','LATE'];

function screen(id, caption, cls, inner) {

}

  ${LIB.slice(0,4).map(t => `<div class="item"><span style="width:20px;height:20px;border-radius:3px;flex:none;
      background:linear-gradient(135deg,${shades(t)[0]},${shades(t)[1]})"></span>${t}</div>`).join('')}

</div>`;

  <span style="width:30px;height:30px;border-radius:4px;flex:none;background:linear-gradient(135deg,${shades('NO SIGNAL')[0]},${shades('NO SIGNAL')[1]})"></span>
  <div style="min-width:0"><div style="font-size:13px;font-weight:500">${t}</div>
  <div class="meta">${a}</div></div>
  <div style="flex:1"></div>
  <div class="meta">1:12 / 3:42</div>
  <div class="transport"><span>◀◀</span><span class="playbtn">❚❚</span><span>▶▶</span></div>
</div>`;

${sidebar('Albums')}
